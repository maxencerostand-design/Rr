<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTANTAUTO — Atelier</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Spline+Sans+Mono:wght@400;500;600&display=swap');

  :root{
    /* ---- Palette NOIR · ROUGE · BLANC ---- */
    --bg:#0b0b0d;
    --panel:#151518;
    --panel-2:#1e1e23;
    --line:#2d2d34;
    --line-soft:#232329;
    --ink:#f3f4f6;
    --ink-dim:#a4a4ae;
    --ink-faint:#66666f;
    --amber:#e21414;        /* ROUGE — identité (nom conservé pour compatibilité du code) */
    --amber-deep:#b30f0f;
    --green:#37c46d;        /* conservé pour les signaux « argent positif / payé / dans les temps » */
    --green-deep:#249a52;
    --red:#ff5a52;          /* rouge alerte (plus clair que le rouge d'identité) */
    --blue:#cfd2d9;         /* neutre clair (ex-bleu) */
    --radius:14px;
    --shadow:0 18px 40px -22px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Archivo',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(226,20,20,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    line-height:1.45;
  }
  .mono{font-family:'Spline Sans Mono',monospace;font-variant-numeric:tabular-nums}

  /* ---------- Shell ---------- */
  .shell{display:flex;min-height:100vh}
  .rail{
    width:240px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    padding:22px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
  .logo{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;position:relative;
    background:linear-gradient(135deg,var(--amber),var(--amber-deep));
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;
    box-shadow:0 6px 16px -6px rgba(226,20,20,.7);
  }
  .brand h1{font-size:16px;font-weight:800;letter-spacing:.06em}
  .brand span{display:block;font-size:10px;color:var(--ink-faint);letter-spacing:.22em;font-weight:600}
  .navlink{
    display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;
    color:var(--ink-dim);font-weight:600;font-size:14.5px;cursor:pointer;border:1px solid transparent;
    transition:.15s;user-select:none;
  }
  .navlink:hover{background:var(--panel-2);color:var(--ink)}
  .navlink.active{background:var(--panel-2);color:var(--ink);border-color:var(--line)}
  .navlink.active .ic{color:var(--amber)}
  .ic{width:19px;height:19px;flex-shrink:0;color:var(--ink-faint);transition:.15s}
  .rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
  .save-state{font-size:11px;color:var(--ink-faint);display:flex;align-items:center;gap:7px;padding:0 8px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(55,196,109,.18)}

  .main{flex:1;min-width:0;padding:30px 38px 70px;max-width:1180px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
  .page-head h2{font-size:27px;font-weight:800;letter-spacing:-.01em}
  .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--amber);font-weight:700;margin-bottom:6px}
  .page-head p{color:var(--ink-dim);font-size:13.5px;margin-top:3px;max-width:560px}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:inherit;font-weight:700;font-size:13.5px;border-radius:10px;padding:11px 17px;
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;transition:.15s;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .btn:hover{border-color:var(--ink-faint)}
  .btn-amber{background:linear-gradient(135deg,var(--amber),var(--amber-deep));color:#fff;border:none}
  .btn-amber:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent}
  .btn svg{width:16px;height:16px}
  .btn-sm{padding:7px 11px;font-size:12px;border-radius:8px}
  .btn-danger:hover{border-color:var(--red);color:var(--red)}

  /* ---------- Cards / gauge ---------- */
  .grid{display:grid;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card-lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:12px}

  .gauge-wrap{
    background:linear-gradient(180deg,var(--panel),#101013);
    border:1px solid var(--line);border-radius:18px;padding:26px 28px;position:relative;overflow:hidden;
  }
  .gauge-wrap::before{
    content:"";position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(135deg,transparent,transparent 11px,rgba(255,255,255,.012) 11px,rgba(255,255,255,.012) 12px);
    pointer-events:none;
  }
  .gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;position:relative}
  .gauge-title{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
  .gauge-day{font-size:12px;color:var(--ink-faint)}
  .gauge-val{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.05;position:relative}
  .gauge-sub{font-size:13px;color:var(--ink-dim);margin-top:2px;position:relative}
  .meter{height:12px;border-radius:7px;background:var(--panel-2);margin-top:18px;overflow:hidden;position:relative;border:1px solid var(--line-soft)}
  .meter-fill{height:100%;border-radius:7px;transition:width .6s cubic-bezier(.2,.8,.2,1);background:linear-gradient(90deg,var(--amber-deep),var(--amber))}
  .meter-marks{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;color:var(--ink-faint)}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .kpi .v{font-size:23px;font-weight:800;letter-spacing:-.01em}
  .kpi .l{font-size:11px;color:var(--ink-faint);margin-top:3px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .kpi .v.pos{color:var(--green)} .kpi .v.neg{color:var(--red)}

  /* ---------- Tables ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px;flex-wrap:wrap}
  .search{
    flex:1;min-width:180px;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;color:var(--ink);font-family:inherit;font-size:13.5px;
  }
  .search:focus{outline:none;border-color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  thead th{
    text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);
  }
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line-soft);color:var(--ink)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .12s}
  tbody tr:hover{background:var(--panel-2)}
  .num{text-align:right;font-family:'Spline Sans Mono',monospace;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.03em}
  .tag-diag{background:rgba(207,210,217,.14);color:var(--blue)}
  .tag-t1{background:rgba(55,196,109,.16);color:var(--green)}
  .tag-t2{background:rgba(226,20,20,.18);color:#ff6b6b}
  .tag-t3{background:rgba(255,90,82,.16);color:var(--red)}
  .tag-piece,.tag-forfait{background:rgba(164,164,174,.14);color:var(--ink-dim)}
  .tag-paid{background:rgba(55,196,109,.16);color:var(--green)}
  .tag-unpaid{background:rgba(255,90,82,.16);color:var(--red)}
  .row-act{display:flex;gap:6px;justify-content:flex-end}
  .iconbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;color:var(--ink-dim);display:grid;place-items:center;transition:.15s}
  .iconbtn:hover{color:var(--ink);border-color:var(--ink-faint)}
  .iconbtn.del:hover{color:var(--red);border-color:var(--red)}
  .iconbtn svg{width:15px;height:15px}

  .empty{padding:54px 20px;text-align:center;color:var(--ink-faint)}
  .empty svg{width:40px;height:40px;margin-bottom:12px;opacity:.5}
  .empty p{font-size:14px;margin-bottom:4px;color:var(--ink-dim)}
  .empty small{font-size:12.5px}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(4,4,6,.7);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 18px;z-index:50;overflow-y:auto}
  .scrim.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:620px;box-shadow:var(--shadow);animation:pop .22s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-size:18px;font-weight:800}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12px;color:var(--ink-dim);font-weight:600;margin-bottom:6px;letter-spacing:.03em}
  .field input,.field select,.field textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    padding:11px 13px;color:var(--ink);font-family:inherit;font-size:14px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber)}
  .field input.mono{font-family:'Spline Sans Mono',monospace}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .frow-3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
  .hint{font-size:11.5px;color:var(--ink-faint);margin-top:5px}

  /* line items */
  .li-head,.li-row{display:grid;grid-template-columns:2fr 1fr .7fr .9fr .9fr 34px;gap:9px;align-items:center}
  .li-head{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:8px;padding:0 2px}
  .li-row{margin-bottom:9px}
  .li-row input,.li-row select{padding:9px 10px;font-size:13px}
  .li-amt{font-family:'Spline Sans Mono',monospace;text-align:right;color:var(--ink-dim);font-size:13px;padding-right:4px}
  .li-del{background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--ink-faint);cursor:pointer;height:34px;display:grid;place-items:center}
  .li-del:hover{color:var(--red);border-color:var(--red)}
  .li-total{display:flex;justify-content:flex-end;gap:18px;align-items:baseline;margin-top:8px;padding-top:14px;border-top:1px solid var(--line)}
  .li-total .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .li-total .val{font-size:26px;font-weight:800;font-family:'Spline Sans Mono',monospace}

  /* settings */
  .set-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .set-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .set-card h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:16px}

  .banner{
    background:linear-gradient(100deg,rgba(226,20,20,.12),rgba(226,20,20,.03));
    border:1px solid rgba(226,20,20,.28);border-radius:12px;padding:13px 16px;margin-bottom:22px;
    display:flex;gap:12px;align-items:flex-start;font-size:13px;color:#f4c1c1;
  }
  .banner svg{width:18px;height:18px;flex-shrink:0;color:var(--amber);margin-top:1px}
  .banner b{color:#ff6b6b}
  .banner-ok{background:linear-gradient(100deg,rgba(55,196,109,.12),rgba(55,196,109,.03));border-color:rgba(55,196,109,.3);color:#bfeccd}
  .banner-ok b{color:#37c46d}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-weight:700;font-size:13.5px;padding:12px 20px;border-radius:11px;opacity:0;transition:.3s;z-index:100;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---------- Écran de connexion cloud ---------- */
  .auth-overlay{position:fixed;inset:0;background:rgba(6,6,8,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
  .auth-overlay.show{display:flex}
  .auth-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:34px 30px;width:100%;max-width:380px;box-shadow:var(--shadow);text-align:center}
  .auth-logo{width:52px;height:52px;border-radius:13px;margin:0 auto 14px;background:linear-gradient(135deg,var(--amber),var(--amber-deep));display:grid;place-items:center;color:#fff;font-weight:900;font-size:22px;box-shadow:0 8px 20px -8px rgba(226,20,20,.7)}
  .auth-card h2{font-size:20px;font-weight:800;letter-spacing:.04em}
  .auth-card p{color:var(--ink-dim);font-size:13px;margin:6px 0 20px}
  .auth-card .field{text-align:left}
  .auth-msg{font-size:12.5px;min-height:16px;margin:2px 0 12px;color:var(--ink-dim)}
  .auth-alt{display:flex;justify-content:space-between;margin-top:14px}
  .linkbtn{background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}
  .linkbtn:hover{color:var(--amber)}

  .month-pick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 14px}
  .month-pick span{font-size:13px;color:var(--ink-dim);font-weight:600}
  .month-pick input{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 10px;font-family:'Spline Sans Mono',monospace;font-size:13px}

  @media(max-width:860px){
    .rail{position:fixed;left:-260px;z-index:60;transition:left .25s}
    .rail.open{left:0}
    .main{padding:18px 16px 60px}
    .kpi-row{grid-template-columns:1fr 1fr}
    .set-grid{grid-template-columns:1fr}
    .frow,.frow-3{grid-template-columns:1fr}
    .menu-btn{display:grid !important}
    .li-head{display:none}
    .li-row{grid-template-columns:1fr 1fr;gap:7px;padding:11px;background:var(--panel-2);border-radius:10px}
  }
  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:61;width:42px;height:42px;border-radius:10px;background:var(--panel);border:1px solid var(--line);place-items:center;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<div class="menu-btn" id="menuBtn" onclick="document.getElementById('rail').classList.toggle('open')">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</div>
<div class="shell">
  <nav class="rail" id="rail">
    <div class="brand">
      <div class="logo">IA</div>
      <div><h1>INSTANTAUTO</h1><span>ATELIER</span></div>
    </div>
    <div class="navlink active" data-view="dashboard"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13h8V3H3zM13 21h8V8h-8zM3 21h8v-5H3zM13 3v3h8V3z"/></svg>Tableau de bord</div>
    <div class="navlink" data-view="invoices"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>Factures</div>
    <div class="navlink" data-view="clients"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clients & véhicules</div>
    <div class="navlink" data-view="parts"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2-2 2.1-2.1z"/></svg>Pièces</div>
    <div class="navlink" data-view="extras"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/></svg>Consommables</div>
    <div class="navlink" data-view="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Réglages</div>
    <div class="rail-foot">
      <button class="btn btn-sm btn-amber" id="autosaveBtn" onclick="toggleAutosave()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Sauvegarde auto</button>
      <button class="btn btn-sm btn-ghost" onclick="exportData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Export manuel</button>
      <label class="btn btn-sm btn-ghost" style="cursor:pointer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>Importer<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>
      <div class="save-state"><span class="dot" id="saveDot"></span><span id="saveTxt">Données enregistrées</span></div>
      <div class="save-state" id="cloudState" style="display:none"><span class="dot" id="cloudDot"></span><span id="cloudTxt">Cloud</span></div>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="auth-overlay" id="authOverlay"></div>
<div class="toast" id="toast"></div>

<script>
// ============================ STATE ============================
const DEFAULTS = {
  settings:{
    name:"INSTANTAUTO", address:"710 Route de Marseille", siret:"",
    rateDiag:70, rateT1:70, rateT2:80, rateT3:90,
    fixed:950, salary:0, days:25, margin:30
  },
  clients:[], invoices:[], parts:[], extras:[], seq:1
};
let DB = JSON.parse(JSON.stringify(DEFAULTS));
let currentView='dashboard';
let dashMonth = new Date().toISOString().slice(0,7);

const STORE_KEY='instantauto:db';
// Detect the artifact storage API; fall back to browser localStorage when the
// file is opened directly (double-clic). Either way, the UI must never wait on it.
const hasCloud = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');

function applyLoaded(raw){
  if(!raw) return;
  try{
    const d = (typeof raw==='string') ? JSON.parse(raw) : raw;
    DB = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), d);
    DB.settings = Object.assign({}, DEFAULTS.settings, d.settings||{});
    // One-time migration: salary removed from the objective (user works without paying themselves for now)
    if(!DB._migr_nosalary){ DB.settings.salary = 0; DB._migr_nosalary = true; }
  }catch(e){ /* corrupt data: keep defaults */ }
}

// Load WITHOUT blocking the UI. Boot never awaits this before the first render.
async function loadDB(){
  try{ const ls=localStorage.getItem(STORE_KEY); if(ls) applyLoaded(ls); }catch(e){}
  if(hasCloud){
    try{
      const r = await Promise.race([
        window.storage.get(STORE_KEY),
        new Promise(res=>setTimeout(()=>res(null),2500))
      ]);
      if(r && r.value){ applyLoaded(r.value); }
    }catch(e){}
  }
}

function setSaveState(state, text){
  const dot=document.getElementById('saveDot'), txt=document.getElementById('saveTxt');
  if(!dot||!txt) return;
  if(state==='saving'){ dot.style.background='var(--amber)'; txt.textContent=text||'Enregistrement…'; }
  else if(state==='ok'){ dot.style.background='var(--green)'; txt.textContent=text||'Données enregistrées'; }
  else { dot.style.background='var(--red)'; txt.textContent=text||'Pense à exporter'; }
}
// Fire-and-forget save: write locally (reliable), mirror to cloud if present,
// and write to the auto-backup file if the user activated it.
function saveDB(){
  setSaveState('saving');
  let localOK=false;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); localOK=true; }catch(e){}
  if(hasCloud){
    try{
      Promise.resolve(window.storage.set(STORE_KEY, JSON.stringify(DB)))
        .then(()=>afterLocalSave(localOK))
        .catch(()=>afterLocalSave(localOK));
    }catch(e){ afterLocalSave(localOK); }
  } else {
    afterLocalSave(localOK);
  }
  scheduleCloudSync();   // synchro Supabase (no-op si non configuré / non connecté)
}
function afterLocalSave(localOK){
  if(autosaveOn && fileHandle){ scheduleFileWrite(localOK); }
  else { setSaveState(localOK?'ok':'err'); }
}

// ============================ AUTOSAVE SUR FICHIER ============================
// API File System Access (Chrome/Edge) : l'utilisateur choisit un fichier UNE fois,
// puis chaque modification y est réécrite automatiquement, en direct.
// Le handle du fichier est mémorisé dans IndexedDB pour survivre au rechargement.
let fileHandle = null;
let autosaveOn = false;
let fileWriteTimer = null;
const supportsFS = ('showSaveFilePicker' in window);
const IDB_NAME='instantauto-fs', IDB_STORE='handles', IDB_KEY='backup';

function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open(IDB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
});}
async function idbSet(v){const db=await idbOpen();return new Promise((res,rej)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).put(v,IDB_KEY);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
async function idbGet(){const db=await idbOpen();return new Promise((res)=>{const t=db.transaction(IDB_STORE,'readonly');const rq=t.objectStore(IDB_STORE).get(IDB_KEY);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);});}
async function idbDel(){const db=await idbOpen();return new Promise((res)=>{const t=db.transaction(IDB_STORE,'readwrite');t.objectStore(IDB_STORE).delete(IDB_KEY);t.oncomplete=()=>res();t.onerror=()=>res();});}

async function verifyPermission(h){
  const opts={mode:'readwrite'};
  try{
    if((await h.queryPermission(opts))==='granted') return true;
    if((await h.requestPermission(opts))==='granted') return true;
  }catch(e){}
  return false;
}
async function writeToFile(){
  if(!fileHandle) return false;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(DB,null,2));
    await w.close();
    return true;
  }catch(e){ return false; }
}
// Debounced file write (évite d'écrire à chaque frappe).
function scheduleFileWrite(localOK){
  clearTimeout(fileWriteTimer);
  fileWriteTimer=setTimeout(async()=>{
    const ok=await writeToFile();
    setSaveState(ok?'ok':(localOK?'ok':'err'), ok?'Sauvegardé sur fichier ✓':'Fichier non écrit — reconnecte');
    if(!ok){ autosaveOn=false; updateAutosaveUI(); }
  },500);
}

// Bouton unique : active / reconnecte / désactive selon l'état.
async function toggleAutosave(){
  if(!supportsFS){
    toast("Sauvegarde auto : utilise Chrome ou Edge (l'export manuel reste dispo).");
    return;
  }
  if(autosaveOn){ // désactiver
    autosaveOn=false; fileHandle=null; await idbDel(); updateAutosaveUI();
    toast('Sauvegarde auto désactivée'); return;
  }
  if(fileHandle){ // reconnecter un fichier déjà choisi (après rechargement)
    if(await verifyPermission(fileHandle)){
      autosaveOn=true; await writeToFile(); updateAutosaveUI();
      setSaveState('ok','Sauvegardé sur fichier ✓'); toast('Sauvegarde auto réactivée');
    }else{ toast('Autorisation refusée pour le fichier'); }
    return;
  }
  // premier choix du fichier
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName:'INSTANTAUTO_sauvegarde.json',
      types:[{description:'Sauvegarde INSTANTAUTO',accept:{'application/json':['.json']}}]
    });
    autosaveOn=true;
    await idbSet(fileHandle);
    await writeToFile();
    updateAutosaveUI();
    setSaveState('ok','Sauvegardé sur fichier ✓');
    toast('Sauvegarde auto activée — tout s’écrit dans ce fichier');
  }catch(e){ /* annulé par l'utilisateur */ }
}
function updateAutosaveUI(){
  const b=document.getElementById('autosaveBtn'); if(!b) return;
  if(!supportsFS){
    b.className='btn btn-sm btn-ghost'; b.style.color='var(--ink-faint)';
    b.title="Disponible sur Chrome / Edge — utilise « Export manuel » ici";
    b.lastChild.textContent='Sauvegarde auto (Chrome/Edge)';
    return;
  }
  if(autosaveOn){
    b.className='btn btn-sm btn-ghost';
    b.style.color='var(--green)'; b.style.borderColor='rgba(55,196,109,.4)';
    b.lastChild.textContent='Sauvegarde auto ● active';
  }else if(fileHandle){
    b.className='btn btn-sm btn-amber'; b.style.color=''; b.style.borderColor='';
    b.lastChild.textContent='Reconnecter la sauvegarde';
  }else{
    b.className='btn btn-sm btn-amber'; b.style.color=''; b.style.borderColor='';
    b.lastChild.textContent='Sauvegarde auto';
  }
}
async function restoreAutosave(){
  if(!supportsFS) { updateAutosaveUI(); return; }
  try{
    const h=await idbGet();
    if(h){ fileHandle=h; autosaveOn=false; } // en pause : nécessite un clic pour ré-autoriser
  }catch(e){}
  updateAutosaveUI();
}

// ============================ HELPERS ============================
const euro = n => (Number(n)||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const euro0 = n => Math.round(Number(n)||0).toLocaleString('fr-FR')+' €';
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const frDate = iso => { if(!iso) return ''; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
function rateFor(type){ const s=DB.settings; return {Diagnostic:+s.rateDiag,T1:+s.rateT1,T2:+s.rateT2,T3:+s.rateT3}[type]||0; }
function lineAmount(li){
  const r=rateFor(li.type);
  if(r>0) return (+li.qty||0)*r;            // main d'oeuvre : qty = heures
  return (+li.qty||0)*(+li.pu||0);          // pièce/forfait : qty * prix unitaire
}
function invoiceTotal(inv){ return (inv.lines||[]).reduce((s,l)=>s+lineAmount(l),0); }
function invoiceMO(inv){ return (inv.lines||[]).reduce((s,l)=>s+(rateFor(l.type)>0?lineAmount(l):0),0); }
function workdaysElapsed(monthStr){
  const [y,m]=monthStr.split('-').map(Number);
  const today=new Date(); const last=new Date(y,m,0);
  const end = (today.getFullYear()===y && today.getMonth()===m-1) ? today : last;
  let c=0; for(let d=1; d<=end.getDate(); d++){ const wd=new Date(y,m-1,d).getDay(); if(wd!==0 && wd!==6) c++; }
  return c;
}
function inMonth(iso,monthStr){ return iso && iso.slice(0,7)===monthStr; }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ---- Voyant de sauvegarde : rouge seulement s'il y a un problème,
//      sinon un court message vert rassurant qui s'efface tout seul. ----
let lastCloudState=null;   // 'saving' | 'online' | 'error' | 'offline' | 'login'
let bannerHideTimer=null;
function updateSaveBanner(){
  const el=document.getElementById('saveBanner');
  if(!el) return;
  clearTimeout(bannerHideTimer);
  el.style.transition=''; el.style.opacity='';

  // Diagnostic : 'ok' (tout va bien) · 'saving' (en cours) · 'problem' (voyant rouge)
  let health='ok', msg='';
  if(cloudEnabled){
    if(!cloudUser){ health='problem'; msg="Tu n'es pas connecté au cloud — tes dernières modifications ne sont pas encore synchronisées. Ouvre <b>Réglages → Cloud</b> pour te reconnecter."; }
    else if(lastCloudState==='error'){ health='problem'; msg="La synchronisation a échoué (vérifie ta connexion internet). Tes données sont gardées sur cet appareil et repartiront automatiquement dès que possible."; }
    else if(lastCloudState==='saving'){ health='saving'; }
  }

  if(health==='problem'){
    // Voyant allumé : reste affiché tant que ce n'est pas réglé.
    el.innerHTML=`<div class="banner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>
      <div><b>Sauvegarde à vérifier.</b> ${msg}</div></div>`;

  }else if(health==='saving'){
    // Transitoire : rien d'alarmant, on laisse l'écran propre.
    el.style.display='none'; el.innerHTML='';
  }else{
    // Tout va bien : petit message vert rassurant, puis disparition automatique.
    el.innerHTML=`<div class="banner banner-ok">
      <svg viewBox="0 0 24 24" fill="none" stroke="#37c46d" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/><path d="m9 15 2 2 4-4"/></svg>
      <div>${cloudEnabled?'Sauvegardé dans le cloud ✓':'Données enregistrées ✓'}</div></div>`;
    el.style.display='';

      el.style.transition='opacity .5s'; el.style.opacity='0';

// ---- Graphique bénéfice net par mois (SVG, sans dépendance) ----
function addMonths(monthStr,n){
  const [y,m]=monthStr.split('-').map(Number);
  const idx=y*12+(m-1)+n;
  return `${Math.floor(idx/12)}-${String(idx%12+1).padStart(2,'0')}`;
}
function monthLabel(monthStr){ const [y,m]=monthStr.split('-'); return `${m}/${y.slice(2)}`; }
function monthlyNet(monthStr){
  const s=DB.settings;
  const ca = DB.invoices.filter(i=>inMonth(i.date,monthStr)).reduce((a,i)=>a+invoiceTotal(i),0);
  const parts = DB.parts.filter(p=>inMonth(p.date,monthStr)).reduce((a,p)=>a+(+p.qty||0)*(+p.pu||0),0);
  const extras = DB.extras.filter(e=>inMonth(e.date,monthStr)).reduce((a,e)=>a+(+e.qty||0)*(+e.pu||0),0);
  return ca - extras - (+s.fixed) - parts;   // même calcul que le bénéfice net du tableau de bord
}
function benefitChart(){
  const START='2026-07', N=12, FLOOR=500;                 // axe X dès 07/2026 · axe Y dès 500 €
  const months=[]; for(let i=0;i<N;i++) months.push(addMonths(START,i));
  const vals=months.map(monthlyNet);
  const niceMax=Math.max(1000, Math.ceil(Math.max(...vals,FLOOR)/500)*500);
  const W=760,H=290, pl=60,pr=18,pt=18,pb=42, cw=W-pl-pr, ch=H-pt-pb;
  const x=i=>pl+(cw/N)*(i+0.5);
  const bw=Math.min(34, cw/N*0.55);
  const yFor=v=>{ const c=Math.max(FLOOR,Math.min(niceMax,v)); return pt+ch*(1-(c-FLOOR)/(niceMax-FLOOR)); };
  const steps=5; let grid='';
  for(let g=0; g<=steps; g++){
    const v=FLOOR+(niceMax-FLOOR)*g/steps, yy=pt+ch*(1-g/steps);
    grid+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#2d2d34" stroke-width="1"/>`+
      `<text x="${pl-9}" y="${yy+4}" text-anchor="end" font-size="11" fill="#66666f" font-family="'Spline Sans Mono',monospace">${euro0(v)}</text>`;
  }
  let bars='';
  months.forEach((mo,i)=>{
    const v=vals[i], bx=x(i)-bw/2, by=yFor(v), bh=Math.max(0,pt+ch-by);
    if(v>=FLOOR){
      bars+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4" fill="url(#benGrad)"/>`+
        `<text x="${x(i)}" y="${by-6}" text-anchor="middle" font-size="10.5" fill="#f3f4f6" font-family="'Spline Sans Mono',monospace">${euro0(v)}</text>`;
    }else{
      // mois sous le seuil de 500 € : repère au ras de l'axe + valeur réelle en gris
      bars+=`<line x1="${bx}" y1="${pt+ch}" x2="${bx+bw}" y2="${pt+ch}" stroke="#66666f" stroke-width="3"/>`+
        `<text x="${x(i)}" y="${pt+ch-6}" text-anchor="middle" font-size="10" fill="#66666f" font-family="'Spline Sans Mono',monospace">${euro0(v)}</text>`;
    }
    bars+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="11" fill="#a4a4ae" font-family="'Spline Sans Mono',monospace">${monthLabel(mo)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    <defs><linearGradient id="benGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e21414"/><stop offset="1" stop-color="#b30f0f"/></linearGradient></defs>
    ${grid}
    <line x1="${pl}" y1="${pt+ch}" x2="${W-pr}" y2="${pt+ch}" stroke="#2d2d34" stroke-width="1.5"/>
    ${bars}
  </svg>`;
}
const depLine=(l,v)=>`<div style="display:flex;justify-content:space-between;padding:7px 0;color:var(--ink-dim)"><span>${l}</span><span class="mono" style="color:var(--ink)">${v}</span></div>`;
function recentInvoices(){
  const list=[...DB.invoices].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  if(!list.length) return `<div style="color:var(--ink-faint);font-size:13px;padding:14px 0">Aucune facture pour l'instant.</div>`;

function onPickClient(){
  const c=DB.clients.find(x=>x.id===val('f-client'));
  if(c){ document.getElementById('f-cname').value=c.name; document.getElementById('f-plate').value=c.plate||''; }
}
function addLine(){ modalLines.push({type:'Pièce',desc:'',qty:'',pu:''}); renderLines(); }
function addLineType(t){ modalLines.push({type:t,desc:'',qty:'',pu:''}); renderLines();
  // focus the description of the new line for fast typing
  setTimeout(()=>{ const rows=document.querySelectorAll('#lines .li-row'); const last=rows[rows.length-1]; if(last){ const inp=last.querySelector('[data-k="desc"]'); if(inp) inp.focus(); } },30);
}
function renderLines(){
  const wrap=document.getElementById('lines');
  wrap.innerHTML=modalLines.map((l,idx)=>{
    const isMO=rateFor(l.type)>0;
    return `<div class="li-row" data-idx="${idx}">
      <input data-k="desc" placeholder="ex : Plaquettes avant / Disques" value="${esc(l.desc)}">
      <select data-k="type">
        ${['Diagnostic','T1','T2','T3','Pièce','Forfait'].map(t=>`<option ${l.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <input data-k="qty" class="mono" type="number" step="0.1" inputmode="decimal" placeholder="${isMO?'heures':'qté'}" value="${esc(l.qty)}">
      <input data-k="pu" class="mono" type="number" step="0.01" inputmode="decimal" placeholder="${isMO?'auto (taux)':'€ / unité'}" value="${esc(l.pu)}" ${isMO?'disabled style="opacity:.4"':''}>
      <span class="li-amt" data-amt>${euro(lineAmount(l))}</span>
      <button class="li-del" data-del title="Retirer">×</button>
    </div>`;
  }).join('');
  // Wire events WITHOUT re-rendering on each keystroke (keeps focus while typing)
  wrap.querySelectorAll('.li-row').forEach(row=>{
    const idx=+row.dataset.idx;
    row.querySelectorAll('input,select').forEach(el=>{
      const k=el.dataset.k;
      const evt = (el.tagName==='SELECT') ? 'change' : 'input';
      el.addEventListener(evt, e=>{
        modalLines[idx][k]=e.target.value;
        if(k==='type'){ renderLines(); }      // type switch changes the row layout -> full redraw
        else { updateAmounts(); }              // text/number edits -> only refresh totals, keep focus
      });
    });
    row.querySelector('[data-del]').addEventListener('click',()=>delLine(idx));
  });
  updateAmounts();
}
function updateAmounts(){
  const wrap=document.getElementById('lines'); if(!wrap) return;
  wrap.querySelectorAll('.li-row').forEach(row=>{
    const idx=+row.dataset.idx;
    const amt=row.querySelector('[data-amt]'); if(amt) amt.textContent=euro(lineAmount(modalLines[idx]));
  });
  const tot=document.getElementById('li-total'); if(tot) tot.textContent=euro(modalLines.reduce((s,l)=>s+lineAmount(l),0));
}
function delLine(i){ modalLines.splice(i,1); if(!modalLines.length) addLine(); else renderLines(); }

      ${cloudEnabled ? `<p style="font-size:13px;color:var(--ink-dim);line-height:1.7">
          ${cloudUser
            ? `Connecté : <b style="color:var(--ink)">${esc(cloudUser.email||'')}</b>.<br>Chaque modification est envoyée <b style="color:var(--ink)">automatiquement</b> dans Firestore — tes données sont accessibles depuis n'importe quel appareil.`
            : `Non connecté — tes données ne sont pas synchronisées pour l'instant.`}
        </p>
        <div style="display:flex;gap:10px;margin-top:12px">
          ${cloudUser
            ? '<button class="btn btn-ghost" onclick="cloudLogout()">Se déconnecter</button>'
            : '<button class="btn btn-amber" onclick="showLogin()">Se connecter</button>'}

        : `<p style="font-size:13px;color:var(--ink-dim);line-height:1.7">
            Non configuré. Renseigne <span class="mono">FIREBASE_CONFIG</span> en haut du script du fichier

    </div>

}
const setInput=(label,key,v,type)=>`<div class="field"><label>${label}</label><input data-set="${key}" type="${type}" value="${esc(v)}" ${type==='number'?'step="any"':''}></div>`;
function saveSettings(){
  document.querySelectorAll('[data-set]').forEach(i=>{ const k=i.dataset.set; DB.settings[k]= (i.type==='number')? (+i.value||0) : i.value; });
  saveDB(); render(); toast('Réglages enregistrés');
}
function resetAll(){
  openModal('Tout réinitialiser ?', `<p style="color:var(--ink-dim);font-size:14px">Cette action efface <b style="color:var(--ink)">toutes</b> tes données (clients, factures, pièces, consommables) et remet les réglages par défaut. Pense à exporter une sauvegarde avant.</p>`,
    ()=>{ DB=JSON.parse(JSON.stringify(DEFAULTS)); saveDB(); currentView='dashboard';
      document.querySelectorAll('.navlink').forEach(x=>x.classList.remove('active')); document.querySelector('[data-view="dashboard"]').classList.add('active');
      render(); toast('Tout a été réinitialisé'); return true; }, 'Effacer tout', true);
}

// ============================ MODAL CORE ============================

  const sc=document.getElementById('scrim');
  sc.innerHTML=`<div class="modal">
    <div class="modal-head"><h3>${title}</h3>
      <button class="iconbtn" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot"><span style="font-size:11.5px;color:var(--ink-faint)">Échap pour fermer</span>
      <div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn ${danger?'btn-danger':'btn-amber'}" id="modalSave">${saveLabel}</button></div></div>
  </div>`;
  sc.classList.add('show');

}
const val = id => { const el=document.getElementById(id); return el?el.value:''; };
function delItem(coll,id){
  openModal('Supprimer ?',`<p style="color:var(--ink-dim);font-size:14px">Cet élément sera définitivement retiré.</p>`,
    ()=>{ DB[coll]=DB[coll].filter(x=>x.id!==id); saveDB(); render(); toast('Supprimé'); return true; },'Supprimer',true);
}
function filterTable(prefix,q){
  q=q.toLowerCase();
  const map={cl:[DB.clients,clientsTable],inv:[DB.invoices,invoicesTable],pt:[DB.parts,partsTable],ex:[DB.extras,extrasTable]};
  const [data,fn]=map[prefix];
  const f=data.filter(o=>JSON.stringify(o).toLowerCase().includes(q));
  document.getElementById(prefix+'-wrap').innerHTML=fn(f);
}
function emptyState(t,s){return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><p>${t}</p><small>${s}</small></div>`;}

// ============================ EXPORT / IMPORT ============================
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`INSTANTAUTO_sauvegarde_${todayISO()}.json`; a.click();
  toast('Sauvegarde téléchargée');
}
function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    DB=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),d); DB.settings=Object.assign({},DEFAULTS.settings,d.settings||{});
    saveDB(); render(); toast('Sauvegarde importée'); }catch(e){ toast('Fichier illisible'); } };
  r.readAsText(file); ev.target.value='';
}

// ============================ FIREBASE (cloud — toujours enregistré) ============================
// 1) Crée un projet sur https://console.firebase.google.com
// 2) Ajoute une app Web ( </> ) : copie l'objet firebaseConfig fourni ci-dessous.
// 3) Build → Authentication → Sign-in method : active « E-mail/Mot de passe ».
// 4) Build → Firestore Database : crée la base, puis colle les règles données dans site/README.md.
// Laisse apiKey vide pour rester 100 % local (comme avant).
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD6BMpJoj7tBjCO-ftn6_hHGOMkkbOcmwU",
  authDomain: "instantautoapp.firebaseapp.com",
  projectId: "instantautoapp",
  storageBucket: "instantautoapp.firebasestorage.app",
  messagingSenderId: "1099163557096",
  appId: "1:1099163557096:web:230e1316868696c9f5fd5d"
};
const cloudEnabled = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
let fb=null, cloudUser=null, cloudSyncTimer=null;   // fb = { auth, db, authApi, fsApi }

function updateCloudUI(state){
  const box=document.getElementById('cloudState'), dot=document.getElementById('cloudDot'), txt=document.getElementById('cloudTxt');
  if(!box) return;
  if(!cloudEnabled){ box.style.display='none'; return; }
  box.style.display='flex';
  const map={
    offline:['var(--ink-faint)','Cloud : hors-ligne'],
    login:  ['var(--amber)','Cloud : connexion requise'],
    saving: ['var(--amber)','Cloud : envoi…'],
    online: ['var(--green)','Cloud : synchronisé ✓'],
    error:  ['var(--red)','Cloud : erreur de synchro']
  };
  const [c,t]=map[state]||map.offline; dot.style.background=c; txt.textContent=t;
  lastCloudState=state; updateSaveBanner();
}
function cloudErr(e){ return e && e.code ? e.code.replace('auth/','').replace(/-/g,' ') : 'erreur'; }

async function initCloud(){
  if(!cloudEnabled){ updateCloudUI(); return; }
  updateCloudUI('login');
  try{
    const appMod  = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
    const authMod = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js');
    const fsMod   = await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js');
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    fb = { auth:authMod.getAuth(app), db:fsMod.getFirestore(app), authApi:authMod, fsApi:fsMod };
    // Le listener gère connexion ET déconnexion (persistance de session incluse).
    authMod.onAuthStateChanged(fb.auth, async (user)=>{
      cloudUser = user;
      if(user){
        document.getElementById('authOverlay').classList.remove('show');
        await pullFromCloud(); render(); updateCloudUI('online');
      }else{
        showLogin();
      }
    });
  }catch(e){ updateCloudUI('error'); toast('Cloud indisponible — mode local'); }
}

// Récupère l'état stocké dans le cloud (source de vérité au démarrage).
async function pullFromCloud(){
  if(!fb||!cloudUser) return;
  try{
    const ref = fb.fsApi.doc(fb.db,'app_state',cloudUser.uid);
    const snap = await fb.fsApi.getDoc(ref);
    if(snap.exists() && snap.data().data){
      applyLoaded(snap.data().data);                    // stocké en JSON (string)
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){}
    }else{
      // Première connexion : on pousse l'état local actuel vers le cloud.
      await fb.fsApi.setDoc(ref, { data:JSON.stringify(DB), updatedAt:Date.now() });
    }
  }catch(e){}
}

// Envoi automatique (débounce) vers le cloud à chaque modification.
function scheduleCloudSync(){
  if(!fb||!cloudUser) return;
  updateCloudUI('saving');
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(async()=>{
    try{
      const ref = fb.fsApi.doc(fb.db,'app_state',cloudUser.uid);
      await fb.fsApi.setDoc(ref, { data:JSON.stringify(DB), updatedAt:Date.now() });
      updateCloudUI('online');
    }catch(e){ updateCloudUI('error'); }
  },600);
}

function showLogin(){
  updateCloudUI('login');
  const el=document.getElementById('authOverlay');
  el.innerHTML=`<div class="auth-card">
    <div class="auth-logo">IA</div>
    <h2>INSTANTAUTO</h2>
    <p>Connecte-toi pour synchroniser tes données dans le cloud.</p>
    <div class="field"><label>Email</label><input id="au-email" type="email" autocomplete="username" placeholder="toi@email.fr"></div>
    <div class="field"><label>Mot de passe</label><input id="au-pass" type="password" autocomplete="current-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="au-msg" class="auth-msg"></div>
    <button class="btn btn-amber" style="width:100%;justify-content:center" onclick="doLogin()">Se connecter</button>
    <div class="auth-alt"><button class="linkbtn" onclick="doSignup()">Créer un compte</button><button class="linkbtn" onclick="skipLogin()">Continuer hors-ligne</button></div>
  </div>`;
  el.classList.add('show');
}
function authMsg(t,err){ const m=document.getElementById('au-msg'); if(m){ m.textContent=t; m.style.color=err?'var(--red)':'var(--ink-dim)'; } }
async function doLogin(){
  const email=val('au-email').trim(), password=val('au-pass');
  if(!email||!password){ authMsg('Email et mot de passe requis',true); return; }
  authMsg('Connexion…');
  try{ await fb.authApi.signInWithEmailAndPassword(fb.auth, email, password); toast('Connecté au cloud'); }
  catch(e){ authMsg(cloudErr(e),true); }   // le listener onAuthStateChanged prend le relais en cas de succès
}
async function doSignup(){
  const email=val('au-email').trim(), password=val('au-pass');
  if(!email||password.length<6){ authMsg('Mot de passe : 6 caractères minimum',true); return; }
  authMsg('Création du compte…');
  try{ await fb.authApi.createUserWithEmailAndPassword(fb.auth, email, password); toast('Compte créé'); }
  catch(e){ authMsg(cloudErr(e),true); }
}
function skipLogin(){ document.getElementById('authOverlay').classList.remove('show'); updateCloudUI('offline'); toast('Mode local (pas de synchro cloud)'); }
async function cloudLogout(){ if(!fb) return; try{ await fb.authApi.signOut(fb.auth); toast('Déconnecté'); }catch(e){} }

// ============================ BOOT ============================
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.getElementById('scrim').addEventListener('click',e=>{ if(e.target.id==='scrim') closeModal(); });

// 1) Render the UI right away so the app is ALWAYS usable, even if storage is slow or absent.
render();
setSaveState('ok');
// 2) Load any saved data in the background, then refresh the view if something came in.
loadDB().then(()=>{ render(); }).catch(()=>{});
// 3) Restore the auto-backup file handle (paused until the user re-authorises with a click).
restoreAutosave();
// 4) Connexion au cloud Firebase (si configuré) : synchro auto à chaque modification.
initCloud();
</script>
